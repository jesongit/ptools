[workspace]
members = ["crates/core", "crates/desktop", "crates/applications", "crates/tools", "crates/ui"]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ptools-core = { path = "crates/core" }
ptools-ui = { path = "crates/ui" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
