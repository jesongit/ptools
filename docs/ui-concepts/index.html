<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Tools · 界面风格实验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#222737;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}button,select,a{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #7360d9;outline-offset:3px}header{background:#fff;border-bottom:1px solid #dce0e8;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;gap:13px;align-items:center}.mark{background:#262a3d;color:#fff;width:42px;height:42px;display:grid;place-items:center;font-size:24px;border-radius:11px}.brand h1{font-size:18px;margin:0 0 5px;font-weight:650}.brand p{font-size:12px;color:#778091;margin:0}.actions{display:flex;align-items:center;gap:10px}.btn{padding:9px 14px;border:1px solid #d5dae4;border-radius:7px;background:#fff;text-decoration:none;color:#394158;white-space:nowrap}.btn.active{background:#30364e;color:white;border-color:#30364e}.themes{padding:18px 28px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px}.theme{position:relative;padding:12px;text-align:left;border:1px solid #d9dfe8;border-radius:9px;background:#f9fafc;min-width:0;transition:.15s}.theme:hover{transform:translateY(-2px);border-color:#9b95be}.theme[aria-pressed=true]{background:white;border-color:#787194;box-shadow:0 2px 0 #787194}.theme .num{font-size:10px;color:#818898;letter-spacing:1px}.theme strong{display:block;font-size:12px;font-weight:600;margin:8px 0 10px;white-space:nowrap}.swatches{display:flex;gap:4px}.swatches i{height:5px;flex:1;border-radius:3px}.details{padding:0 28px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px}.details h2{margin:0;font-size:15px;font-weight:600}.details p{margin:6px 0 0;color:#727d8f;font-size:12px}.badge{display:inline-block;font-size:10px;background:#e2e6f0;color:#626c80;padding:4px 7px;border-radius:4px;margin-left:9px;vertical-align:middle}.canvas{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 28px 20px}.canvas.split{grid-template-columns:repeat(2,minmax(0,1fr))}.pane{min-width:0;overflow:hidden;border:1px solid #cfd5df;border-radius:10px;background:#fff;box-shadow:0 8px 30px #2b345315}.pane-title{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #dddfe7;background:#fafbfd;gap:12px}.pane-title span{font-size:11px;color:#697385}.pane-title a{color:#5a6078;font-size:11px;text-decoration:none}.pane-title select{border:0;background:transparent;color:#384359;max-width:65%;font-size:12px}.viewport{position:relative;overflow:hidden;background:#fff}iframe{position:absolute;top:0;left:0;border:0;width:1440px;height:850px;transform-origin:top left}footer{padding:0 28px 18px;font-size:11px;color:#7b8494;display:flex;justify-content:space-between;gap:10px}.chosen{color:#574c8f}.mobile-hint{display:none}@media(max-width:1100px){.themes{grid-template-columns:repeat(4,1fr)}header{padding:16px 20px}.themes{padding:16px 20px}.canvas{padding:0 20px 16px}.details{padding:0 20px 14px}.theme strong{font-size:13px}}@media(max-width:650px){header{align-items:flex-start;flex-direction:column;gap:14px}.themes{grid-template-columns:repeat(2,1fr);gap:7px}.theme{padding:10px}.theme strong{margin:4px 0 8px}.canvas.split{grid-template-columns:1fr}.details{align-items:flex-start;flex-direction:column}.brand p{font-size:11px}footer{flex-direction:column}.mobile-hint{display:block;font-size:11px;color:#737b8a}}
</style></head>
<body><header><div class="brand"><div class="mark">N</div><div><h1>NOVA Tools <span style="font-weight:400;color:#9298a7">/</span> 界面风格实验室</h1><p>08 个独立方案 · 相同功能布局 · 可交互网页原型</p></div></div><div class="actions"><button class="btn" id="compare" aria-pressed="false">双方案对比</button><button class="btn" id="favorite">收藏当前方案</button><a class="btn active" id="full" href="01-academy.html" target="_blank" rel="noopener">完整打开 ↗</a></div></header>
<nav class="themes" aria-label="选择界面风格" id="themes"></nav>
<div class="details"><div><h2 id="name"></h2><p id="description"></p></div><span class="mobile-hint">点击「完整打开」可按原尺寸体验</span><span class="chosen" id="saved"></span></div>
<main class="canvas" id="canvas"><section class="pane"><div class="pane-title"><span id="left-title"></span><a id="left-open" target="_blank" rel="noopener">原尺寸体验 ↗</a></div><div class="viewport"><iframe id="left" title="当前风格交互预览"></iframe></div></section><section class="pane" id="right-pane" hidden><div class="pane-title"><select id="second" aria-label="选择右侧对比方案"></select><a id="right-open" target="_blank" rel="noopener">原尺寸体验 ↗</a></div><div class="viewport"><iframe id="right" title="对比风格交互预览"></iframe></div></section></main>
<footer><span>原型中的截图、任务和设备数据均为演示；运行操作仅改变网页状态。</span><span>先比较 01 / 02 / 04 / 08，再选择你喜欢的方向。</span></footer>
<script>
const themes=[
['01','academy','清透蓝白学园','明亮的天空色、电子学生证细节与轻量终端面板。',['#f7fbff','#d4edf9','#418fdd']],
['02','tactical','黑灰橙战术终端','切角模块、设备编号与工业秩序，聚焦清晰的执行流程。',['#202124','#45484d','#f7a432']],
['03','healing','奶油粉紫治愈','温柔的文具感与柔和圆角，为日常工作留一点轻松。',['#faf3e9','#ddcdeb','#f2bfb6']],
['04','manga','都市潮流漫画','漫画网点、醒目标签与硬阴影，让操作区域更有个性。',['#242526','#ecebdc','#d7fc55']],
['05','wa','现代和风二次元','细线、书签与朱红印记，保持安静而有秩序的工作空间。',['#f5f0e7','#393d3b','#ab4d47']],
['06','magic','星夜魔法工坊','夜紫工作台、星图细节与柔金色点缀，探索你的工具。',['#181c36','#474065','#dfc48a']],
['07','pixel','复古像素桌面','分层窗口边框与像素助手，搭配清晰的现代正文。',['#e7e8e2','#538d88','#e28b78']],
['08','minimal','极简专业工作站','精确间距、低饱和蓝紫与细微的二次元视觉身份。',['#f4f5f7','#3c414e','#8b8cab']]];
const $=s=>document.querySelector(s);const path=t=>`${t[0]}-${t[1]}.html`;let selected=0,split=false,saved=null;try{saved=localStorage.getItem('nova-style')}catch{};
$('#themes').innerHTML=themes.map((t,i)=>`<button class="theme" data-index="${i}" aria-pressed="false"><span class="num">DIRECTION ${t[0]}</span><strong>${t[2]}</strong><span class="swatches">${t[4].map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`).join('');
$('#second').innerHTML=themes.map((t,i)=>`<option value="${i}">${t[0]} / ${t[2]}</option>`).join('');$('#second').value='7';
function fit(){document.querySelectorAll('.viewport').forEach(v=>{const width=v.clientWidth;if(!width)return;const ratio=width/1440;v.style.height=`${850*ratio}px`;v.querySelector('iframe').style.transform=`scale(${ratio})`})};const observer=new ResizeObserver(fit);document.querySelectorAll('.viewport').forEach(v=>observer.observe(v));
function displaySaved(){const t=themes.find(t=>t[0]===saved);$('#saved').textContent=t?`已收藏：${t[0]} ${t[2]}`:'';$('#favorite').textContent=saved===themes[selected][0]?'取消收藏':'收藏当前方案'}
function select(i){selected=i;const t=themes[i];$('#left').src=path(t);$('#full').href=path(t);$('#left-open').href=path(t);$('#left-title').textContent=`${t[0]} / ${t[2]} · 交互预览`;$('#name').textContent=`${t[0]} ${t[2]}`;$('#description').textContent=t[3];document.querySelectorAll('.theme').forEach((b,n)=>b.setAttribute('aria-pressed',n===i));history.replaceState(null,'',`#${t[0]}`);displaySaved();fit()}
function second(){const t=themes[+$('#second').value];$('#right').src=path(t);$('#right-open').href=path(t)}
$('#themes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(+b.dataset.index)});$('#second').addEventListener('change',second);
$('#compare').addEventListener('click',()=>{split=!split;$('#canvas').classList.toggle('split',split);$('#right-pane').hidden=!split;$('#compare').classList.toggle('active',split);$('#compare').setAttribute('aria-pressed',split);$('#compare').textContent=split?'返回单方案':'双方案对比';if(split)second();fit()});
$('#favorite').addEventListener('click',()=>{saved=saved===themes[selected][0]?null:themes[selected][0];try{if(saved)localStorage.setItem('nova-style',saved);else localStorage.removeItem('nova-style')}catch{}displaySaved()});
let initial=themes.findIndex(t=>t[0]===location.hash.slice(1));select(initial<0?0:initial);
</script></body></html>
